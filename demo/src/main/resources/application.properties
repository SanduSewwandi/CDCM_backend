spring.application.name=cdcm
server.port=${PORT:8082}

# ADDED &authSource=admin at the end of this line
spring.data.mongodb.uri=${MONGODB_URI}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.demo=DEBUG

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Brevo SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:hiruireshasewwandi@gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Brevo REST API (HTTPS port 443 - Recommended for Render free tier where SMTP is blocked)
brevo.api.key=${BREVO_API_KEY:}

# Resend Email API (Fallback)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

payhere.merchant.id=${PAYHERE_MERCHANT_ID:YOUR_MERCHANT_ID}
payhere.merchant.secret=${PAYHERE_MERCHANT_SECRET:YOUR_MERCHANT_SECRET}